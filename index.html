<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiwen's Space | Tin Case Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 铁盒容器：使用你完整的图作为底 */
        .tin-case-container {
            position: relative;
            width: 1000px;  
            height: 562px;  
            background-image: url('tin-case-bg.jpg'); /* 完整底图 */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-radius: 20px;
        }

        /* 浮动交互层 */
        .interactive-item {
            position: absolute;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            /* 初始状态：完全透明，融入底图 */
            opacity: 0; 
        }

        /* 核心魔法：鼠标移入时瞬间实体化、放大、并增加强烈发光遮挡底层 */
        .interactive-item:hover {
            opacity: 1; /* 变成实体 */
            transform: scale(1.08) translateY(-8px); /* 放大并向上飘 */
            /* 强烈的多重阴影，既产生立体感，又能把底图边缘完美盖住 */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)) drop-shadow(0 0 10px rgba(255,255,255,0.8));
            z-index: 50; 
        }

        /* --- 覆盖定位（微调像素让它跟你的底图完美重合） --- */

        /* 1. 照片 */
        #item-about {
            width: 145px;
            top: 195px;
            left: 350px;
            transform: rotate(-3deg);
        }
        #item-about:hover {
            transform: scale(1.08) translateY(-8px) rotate(-3deg);
        }

        /* 2. 手帐本 */
        #item-experiences {
            width: 153px;
            top: 250px;
            left: 315px;
        }

        /* 3. 拓麻歌子 */
        #item-projects {
            width: 145px;
            top: 315px;
            left: 545px;
            transform: rotate(5deg);
        }
        #item-projects:hover {
            transform: scale(1.08) translateY(-8px) rotate(5deg);
        }

        /* --- 提示标签 --- */
        .tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            pointer-events: none; 
            opacity: 0;
            transform: scale(0.8) translate(-50%, -100%);
            transition: all 0.2s ease;
            z-index: 100;
            white-space: nowrap;
        }

        /* 当对应的动态元件被 hover 时显示文字 */
        .interactive-item:hover + .tooltip {
            opacity: 1;
            transform: scale(1) translate(-50%, -140%);
        }
    </style>
</head>
<body>

    <div class="tin-case-container">
        
        <img src="about-me.png" id="item-about" class="interactive-item" alt="About Me" onclick="navigateTo('about')">
        <div class="tooltip" style="top: 195px; left: 422px;">✨ ABOUT ME</div>

        <img src="experiences.png" id="item-experiences" class="interactive-item" alt="Experiences" onclick="navigateTo('experiences')">
        <div class="tooltip" style="top: 250px; left: 390px;">📁 EXPERIENCES</div>

        <img src="projects.png" id="item-projects" class="interactive-item" alt="Projects" onclick="navigateTo('projects')">
        <div class="tooltip" style="top: 315px; left: 617px;">🎮 PROJECTS</div>

    </div>

    <script>
        function navigateTo(page) {
            if(page === 'about') {
                alert('即将进入 About Me 页面！');
            } else if(page === 'experiences') {
                alert('即将进入 Experiences 经历页面！');
            } else if(page === 'projects') {
                alert('即将进入 Projects 项目游玩页面！');
            }
        }
    </script>

</body>
</html>
