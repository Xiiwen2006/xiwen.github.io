<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Xiwen's World</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dura+Sans:wght@700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f6f3; /* 温暖细腻的纸张质感底色 */
            height: 100vh; /* 严格锁定一屏高度 */
            width: 100vw;  /* 严格锁定一屏宽度 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            overflow: hidden; /* 彻底禁止出现任何滚动条 */
        }

        /* 桌面端大容器 */
        .main-layout {
            display: flex;
            align-items: center;
            justify-content: center; /* 居中紧凑排列文字与铁盒 */
            width: 100vw;
            height: 100vh;
            padding: 0 40px;
            gap: -80px; /* 允许华丽文字与铁盒产生适度的艺术性重叠，还原设计稿质感 */
        }

        /* --- 左侧文字排版板块（分三行，字体独立样式，极致华丽化） --- */
        .text-sidebar {
            flex: 0 0 auto;
            width: 480px; /* 紧凑字块宽度 */
            color: #111111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* 内部居中对齐 */
            z-index: 100; /* 确保文字始终压在铁盒上方 */
            transform: translateX(-30px); /* 整体微调向左，与铁盒平衡 */
        }

        /* 第一行 Welcome to */
        .title-welcome {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-style: italic; /* 用优雅斜体引出 */
            font-weight: 400;
            line-height: 1.1;
            color: #333333;
            margin-right: 150px; /* 错落排版 */
        }

        /* 第二行 Xiwen's - 使用极度华丽的 Dura Sans 粗体 */
        .title-name {
            font-family: 'Dura Sans', serif; /* 极具手账艺术感的顶级华丽字体 */
            font-size: 7.2rem; /* 字号巨大，气场拉满 */
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -3px; /* 紧凑的字母间距，强化整体视觉冲击 */
            color: #000000;
            transform: rotate(-4deg); /* 带有一个好看的艺术性倾斜角度 */
            margin: -5px 0 -15px 0; /* 错落重叠排版 */
            text-align: center;
        }

        /* 第三行 world. */
        .title-world {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 400;
            line-height: 1.1;
            margin-left: 150px; /* 错落排版 */
        }

        /* 移除左侧原本的小字说明，保持页面干净聚焦 */

        /* --- 右侧铁盒交互板块（通过核心放大，彻底消灭两侧宽黑边阻碍） --- */
        .tin-case-container {
            position: relative;
            flex: 0 0 auto;
            height: 85vh; /* 高度占屏幕的 85% */
            width: calc(85vh * (1000 / 562.5)); /* 保持完美高宽比 */
            max-height: 720px; 
            max-width: 1280px;
            
            background-image: url('tin-case-bg.jpg'); 
            background-size: 162% auto; /* 核心魔法：放大1.6倍底图，直接把两侧黑边推开并隐藏 */
            background-position: 49.5% center; /* 完美聚焦在正中央的金属铁盒上 */
            background-repeat: no-repeat;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.12)); 
            z-index: 1;
        }

        /* 所有可交互物品的初始状态（保持完全可见） */
        .interactive-item {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 1; /* 保持可见，不隐藏 */
            z-index: 10;
        }

        /* 鼠标悬停时的通用高亮魔法 */
        .interactive-item:hover {
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.45)) drop-shadow(0 0 15px rgba(255,255,255,0.8));
            z-index: 50;
        }

        /* --- 配合无黑边新视窗与文字错落重叠调整坐标定位 --- */

        /* 1. 照片 (About Me) */
        #item-about {
            width: 23%;       
            top: 21%;      
            left: 26.5%;       
            transform: rotate(-3deg);
            transform-origin: center center;
        }
        #item-about:hover {
            transform: scale(1.08) rotate(-3deg);
        }

        /* 2. 手帐本 (Experiences) */
        #item-experiences {
            width: 24%;    
            top: 41.5%;        
            left: 21.2%;       
            transform: rotate(-6deg); 
            transform-origin: center center;
        }
        #item-experiences:hover {
            transform: scale(1.08) rotate(-6deg); 
        }

        /* 3. 拓麻歌子 (Projects) */
        #item-projects {
            width: 23%;      
            top: 68.8%;        
            left: 57.5%;       
            transform: rotate(5deg);
            transform-origin: center center; 
        }
        #item-projects:hover {
            transform: scale(1.25) rotate(5deg); 
        }

        /* --- 动态弹出的提示标签 --- */
        .tooltip {
            position: absolute;
            background: #111111;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.8) translate(-50%, -100%);
            transition: all 0.2s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .interactive-item:hover + .tooltip {
            opacity: 1;
            transform: scale(1) translate(-50%, -130%);
        }

        /* --- 📱 手机移动端布局适配（同上一版，保持响应式） --- */
        .mobile-portfolio {
            display: none; 
            width: 100%;
            padding: 40px 24px;
        }

        .mobile-tin-case-preview {
            width: 100%;
            aspect-ratio: 1000 / 562.5; 
            background-image: url('tin-case-bg.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 40px; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1));
        }

        @media (max-height: 780px) {
            /* 智能缩放：当屏幕真的很矮时，等比例缩小字体防止溢出一屏 */
            .title-name { font-size: 6rem; }
            .title-welcome, .title-world { font-size: 2.8rem; }
            .main-layout { gap: -100px; }
        }

        /* 移动端自适应 */
        @media (max-width: 992px) {
            .main-layout {
                display: none; 
            }
            body {
                overflow-y: auto;
                align-items: flex-start;
                height: auto;
                width: auto;
            }
            .mobile-portfolio {
                display: block; 
            }
            .mobile-header h1 {
                font-family: 'Playfair Display', serif;
                font-size: 2.5rem;
                margin-bottom: 12px;
                line-height: 1.2;
            }
            .mobile-header p {
                font-size: 0.85rem;
                color: #666;
                margin-bottom: 24px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .mobile-card {
                background: white;
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 20px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .mobile-card img {
                width: 70px;
                height: auto;
                object-fit: contain;
            }
            .mobile-card-text h2 {
                font-size: 1.1rem;
                margin-bottom: 4px;
                color: #111;
            }
            .mobile-card-text p {
                font-size: 0.85rem;
                color: #888;
            }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="text-sidebar">
            <span class="title-welcome">Welcome to</span>
            <span class="title-name">Xiwen's</span>
            <span class="title-world">world.</span>
        </div>

        <div class="tin-case-container">
            <img src="about-me.png" id="item-about" class="interactive-item" alt="About Me" onclick="window.location.href='about.html'">
            <div class="tooltip" style="top: 21%; left: 38%;">ABOUT ME</div>

            <img src="experiences.png" id="item-experiences" class="interactive-item" alt="Experiences" onclick="window.location.href='experiences.html'">
            <div class="tooltip" style="top: 41.5%; left: 33.2%;">EXPERIENCES</div>

            <img src="projects.png" id="item-projects" class="interactive-item" alt="Projects" onclick="window.location.href='projects.html'">
            <div class="tooltip" style="top: 68.8%; left: 69%;">PROJECTS</div>
        </div>
    </div>

    <div class="mobile-portfolio">
        <div class="mobile-header">
            <h1>Welcome to Xiwen's world.</h1>
            <p>Scroll down to explore my space</p>
        </div>

        <div class="mobile-tin-case-preview"></div>

        <div class="mobile-card" onclick="window.location.href='about.html'">
            <img src="about-me.png" alt="About Me">
            <div class="mobile-card-text">
                <h2>About Me</h2>
                <p>Learn more about who I am and my tech journey.</p>
            </div>
        </div>

        <div class="mobile-card" onclick="window.location.href='experiences.html'">
            <img src="experiences.png" alt="Experiences">
            <div class="mobile-card-text">
                <h2>Experiences</h2>
                <p>My internships and VR research works.</p>
            </div>
        </div>

        <div class="mobile-card" onclick="window.location.href='projects.html'">
            <img src="projects.png" alt="Projects">
            <div class="mobile-card-text">
                <h2>Projects</h2>
                <p>Interactive web apps and Unity game builds.</p>
            </div>
        </div>
    </div>

</body>
</html>
